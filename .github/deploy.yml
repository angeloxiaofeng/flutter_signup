name: Deploy Flutter Web

on:
 push:
  branches:
   - main

permissions:
 contents: read
 pages: write
 id-token: write

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout
     uses: actions/checkout@v4

   - name: Setup Flutter
     uses: subosito/flutter-action@v2
     with:
      flutter-version: 'stable'

   - name: Get dependencies
     run: flutter pub Get

   - name: Build Web
  run: flutter build web --release --base-href "/flutter_signup/"

   - name: Upload Artifact
     run: actions/upload-pages-artifact@v3
     with:
      path: build/web

  deploy:
   needs: build
   runs-on: ubuntu-latest

   environment:
    name: github-pages
    url: $
    {{ steps.deployment.output.page_url }}

   steps:
    - name: Deploy to Github Pages
      id: deployment
      uses: actions/deploy-pages@v4
